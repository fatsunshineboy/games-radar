# 看点啥 (See Something) - 配置文件

# LLM 设置
llm:
  api_key: "${OPENAI_API_KEY}"
  AIHUBMIX_API_KEY: "${AIHUBMIX_API_KEY}"
  base_url: "${OPENAI_BASE_URL}"
  model: "${OPENAI_MODEL}"
  temperature: 0.3
  max_tokens: 8192
  daily_budget: 200

# 编辑部并发设置
concurrency:
  editor_batch_size: 15
  editor_batch: 10            # Editor批次并行数
  writer: 4                  # Writer并行数
  reviewer: 4                # Reviewer并行数
  retry_delay_ms: 1000        # 重试退让时间
  max_retries: 3              # 最大重试次数

# 收集设置
collection:
  # 并发设置
  rss_concurrency: 1        # RSS源并行获取数
  content_concurrency: 20     # 文章内容并行获取数
  # 每个来源的最大条数，避免单一来源过多占比
  max_per_source: 200
  fetch_content: true
  content_max_length: 20000

# 交叉验证去重
deduplication:
  similarity_threshold: 0.4
  boost_per_source: 12

# 评分系统
scoring:
  # 基础分由 Editor 智能体评估 (0-100)
  # = 行业影响力(0-30) + 受众广度(0-20) + 稀缺性(0-20) + 后续跟踪性(0-15) + 可操作性(0-15)

  # 来源权威加成
  source_tier_bonus:
    tier1: 20  # 官方第一手: PlayStation Blog, Xbox Wire, Nintendo
    tier2: 15  # 权威媒体: IGN, Polygon, GamesIndustry.biz, Gematsu
    tier3: 10  # 专业媒体: Eurogamer, PC Gamer, GameSpot, Game Developer
    tier4: 5   # 综合媒体: Kotaku, GameRant, Siliconera
    tier5: 0   # 社区: Reddit

  # 多源交叉加成: (source_count - 1) × cross_source_bonus, 封顶 max_cross_bonus
  cross_source_bonus: 12
  max_cross_bonus: 36

  # 时效性加成
  freshness:
    within_24h: 10
    within_48h: 5
    within_72h: 0
    over_72h: -5

  # 重复惩罚 (与前3天报道相似度)
  history_penalty:
    similarity_medium: -20   # 相似度 0.6-0.7
    similarity_high: -50     # 相似度 > 0.7
    lookback_days: 3

# 输出设置
output:
  max_items: 10              # 每日最多展示条数
  max_per_category: 4        # 同一领域最多条数
  top_count: 5               # "今日要闻"条数
  normal_count: 20           # "值得关注"条数，增加冗余条数保证输出文章的数量
  max_revisions: 5           # Writer-Reviewer 最大修订循环次数

# 站点信息
site:
  name_zh: "看点啥"
  name_en: "See Something"
  description_zh: "游戏资讯每日简报"
  description_en: "Daily Gaming News Digest"
  base_url: ""               # GitHub Pages base URL, 留空则为根路径
