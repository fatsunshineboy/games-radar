name: Daily Digest

on:
  push:
    branches: [main]
    paths-ignore:
      - 'digests/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run daily digest pipeline
        id: digest
        run: |
          npm run start

          DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
          echo "date=$DATE" >> $GITHUB_OUTPUT

          if [ -f "digests/${DATE}.md" ]; then
            echo "has_digest=true" >> $GITHUB_OUTPUT
            echo "digest_path=digests/${DATE}.md" >> $GITHUB_OUTPUT
          else
            echo "has_digest=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit digests only
        if: steps.digest.outputs.has_digest == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add digests/

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(TZ='Asia/Shanghai' date +%Y-%m-%d)
            git commit -m "daily: ${DATE} digest"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3.0.2-node.24

      - name: Create GitHub Issue
        if: steps.digest.outputs.has_digest == 'true'
        uses: actions/github-script@v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const date = '${{ steps.digest.outputs.date }}';
            const digestPath = '${{ steps.digest.outputs.digest_path }}';

            let content = fs.readFileSync(digestPath, 'utf-8');

            const maxLength = 60000;
            if (content.length > maxLength) {
              content = content.substring(0, maxLength) + '\n\n... (content is too long)';
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📰 Daily Gaming News Digest ${date}`,
              body: content,
              labels: ['digest', 'daily']
            });

            console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
